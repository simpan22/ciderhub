{% extends "base.html" %}

{% block title %}CiderHub — Batches{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Batches</h1>
</section>

<form class="card inline-form" method="post" action="/batches">
    <h2>New batch</h2>
    <label>Season
        <select name="season_id" required
                hx-get="/batches/suggest-code" hx-trigger="change" hx-include="this"
                hx-target="#code-input" hx-swap="outerHTML">
            {% for s in seasons %}
            <option value="{{ s.id }}">{{ s.year }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Code <input type="text" id="code-input" name="code" value="{{ suggested_code }}" placeholder="2026-A" required></label>
    <label>Name <input type="text" name="name" placeholder="optional, e.g. Bramley blend"></label>
    <button type="submit">Create</button>
</form>

<table class="card table">
    <thead>
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Season</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for b in batches %}
        <tr>
            <td><a href="/batches/{{ b.id }}">{{ b.code }}</a></td>
            <td>{{ b.name.as_deref().unwrap_or("—") }}</td>
            <td>{{ b.season_year }}</td>
            <td><span class="status status--{{ b.status }}">{{ b.status }}</span></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
