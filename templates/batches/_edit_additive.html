<li id="event-{{ event_id }}" class="timeline__edit-row">
    <form class="log-form" hx-put="/batches/{{ batch_id }}/events/additive/{{ event_id }}" hx-target="#batch-timeline" hx-swap="outerHTML">
        <div class="log-form__fields">
            <label>Date <input type="date" name="occurred_at" value="{{ occurred_at }}" required></label>
            <label>Substance <input type="text" name="substance" value="{{ substance }}" required></label>
            <label>Amount <input type="number" step="0.01" min="0" name="amount" value="{{ amount }}" required></label>
            <label>Unit
                <select name="unit_id" required>
                    {% for u in units %}
                    <option value="{{ u.id }}" {% if u.selected %}selected{% endif %}>{{ u.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Notes <input type="text" name="notes" value="{{ notes.as_deref().unwrap_or("") }}"></label>
        </div>
        <div class="log-form__actions">
            <button type="button" hx-get="/batches/{{ batch_id }}/timeline" hx-target="#batch-timeline" hx-swap="outerHTML">Cancel</button>
            <button type="submit">Save</button>
        </div>
    </form>
</li>
