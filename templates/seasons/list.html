{% extends "base.html" %}

{% block title %}CiderHub — Seasons{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Seasons</h1>
    <p class="muted">A season always runs the calendar year, January to January.</p>
</section>

<form class="card inline-form" hx-post="/seasons" hx-target="#seasons-table-body" hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) this.reset()">
    <h2>Add season</h2>
    <label>Year <input type="number" name="year" placeholder="2026" required></label>
    <button type="submit">Add</button>
</form>

<table class="card table">
    <thead>
        <tr>
            <th>Year</th>
            <th></th>
        </tr>
    </thead>
    <tbody id="seasons-table-body">
        {% include "seasons/_table_body.html" %}
    </tbody>
</table>
{% endblock %}
