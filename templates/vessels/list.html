{% extends "base.html" %}

{% block title %}CiderHub — Vessels{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Vessels</h1>
</section>

<form class="card inline-form" hx-post="/vessels" hx-target="#vessels-table-body" hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) this.reset()">
    <h2>Add vessel</h2>
    <label>Name <input type="text" name="name" placeholder="Carboy A" required></label>
    <label>Capacity (L) <input type="number" step="0.1" name="capacity_l"></label>
    <label>Kind <input type="text" name="kind" placeholder="carboy, fermenter, tank" required></label>
    <label class="checkbox"><input type="checkbox" name="active" checked> active</label>
    <button type="submit">Add</button>
</form>

<table class="card table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Capacity</th>
            <th>Kind</th>
            <th>Status</th>
            <th></th>
        </tr>
    </thead>
    <tbody id="vessels-table-body">
        {% include "vessels/_table_body.html" %}
    </tbody>
</table>
{% endblock %}
